# SoloDevBoard public product site (Hextra).
baseURL: "https://solodevboard.com/"
title: "SoloDevBoard"
locale: en-gb
defaultContentLanguage: en-gb
enableRobotsTXT: true
enableGitInfo: true

outputs:
  home: [html]
  page: [html, markdown]
  section: [html, rss, markdown]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: About
      pageRef: /about
      weight: 1
    - name: User Guide
      pageRef: /docs
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/markheydon/solo-dev-board"
      params:
        icon: github
    - name: Theme Toggle
      weight: 5
      params:
        type: theme-toggle

params:
  description: "A single pane of glass for solo developers managing GitHub workloads across multiple repositories."
  externalLinkDecoration: false
  releaseVersion: unreleased

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  displayUpdatedDate: true
  dateFormat: "2 January 2006"

  search:
    enable: true
    type: flexsearch

  flexsearch:
    index: content
    tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/markheydon/solo-dev-board/edit/main/website/content"

  page:
    width: normal
    contextMenu:
      enable: true

  imageZoom:
    enable: true

  toc:
    displayTags: false

  highlight:
    copy:
      enable: true
      display: hover

caches:
  images:
    dir: ":cacheDir/images"
