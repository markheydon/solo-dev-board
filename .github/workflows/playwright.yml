name: Playwright

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (${{ matrix.auth }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - auth: pat
            mtp_filter_args: --filter-query "/[Category=E2E]"
          - auth: hosted
            mtp_filter_args: --filter-query "/[(Category=E2E)&(AuthMode=Hosted)]"

    env:
      PLAYWRIGHT_BASE_URL: http://localhost:5080
      E2E_AUTH_MODE: ${{ matrix.auth }}
      BROWSER: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore and build E2E project
        run: |
          dotnet restore tests/E2E/SoloDevBoard.E2E.Tests/SoloDevBoard.E2E.Tests.csproj
          dotnet build tests/E2E/SoloDevBoard.E2E.Tests/SoloDevBoard.E2E.Tests.csproj -c Release --no-restore -p:SkipPlaywrightInstall=true

      - name: Install Playwright browsers
        run: pwsh tests/E2E/SoloDevBoard.E2E.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Verify Playwright test discovery
        run: >
          dotnet test tests/E2E/SoloDevBoard.E2E.Tests/SoloDevBoard.E2E.Tests.csproj
          --no-build
          -c Release
          -p:RunE2ETests=true
          -p:SkipPlaywrightInstall=true
          --list-tests
          -- ${{ matrix.mtp_filter_args }}

      - name: Run Playwright tests
        run: >
          dotnet test tests/E2E/SoloDevBoard.E2E.Tests/SoloDevBoard.E2E.Tests.csproj
          --no-build
          -c Release
          -p:RunE2ETests=true
          -p:SkipPlaywrightInstall=true
          -- ${{ matrix.mtp_filter_args }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.auth }}
          path: tests/E2E/SoloDevBoard.E2E.Tests/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
