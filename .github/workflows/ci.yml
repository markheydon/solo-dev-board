name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SoloDevBoard.slnx

      - name: Verify formatting
        run: dotnet format SoloDevBoard.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build solution
        run: dotnet build SoloDevBoard.slnx --no-restore

      - name: Run tests
        run: dotnet test SoloDevBoard.slnx --no-build --verbosity normal
