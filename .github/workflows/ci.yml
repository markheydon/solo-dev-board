name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SoloDevBoard.slnx

      - name: Verify formatting
        run: dotnet format SoloDevBoard.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build solution
        run: dotnet build SoloDevBoard.slnx --no-restore

      - name: Run tests
        run: dotnet test SoloDevBoard.slnx --no-build --verbosity normal

  roadmap-sync-helpers:
    name: Roadmap sync helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run GitHub automation script tests
        run: node --test .github/scripts/*.test.mjs

  e2e-pat:
    name: End-to-End (Playwright, PAT mode)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/E2E/package-lock.json

      - name: Restore and build solution
        run: |
          dotnet restore SoloDevBoard.slnx
          dotnet build src/App/SoloDevBoard.App/SoloDevBoard.App.csproj --no-restore

      - name: Install Playwright dependencies
        working-directory: tests/E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (PAT mode)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5080
          E2E_AUTH_MODE: pat
        run: |
          APP_LOG="$(mktemp)"
          echo "Application logs are captured in: $APP_LOG"

          ASPNETCORE_URLS=http://localhost:5080 \
            ASPNETCORE_ENVIRONMENT=Development \
            GitHubAuth__PersonalAccessToken=ci-e2e-placeholder \
            GitHubAuth__OwnerLogin=ci-test-user \
            GitHubAuth__HostedSignInEnabled=false \
            HostedAdmissionControl__Enabled=false \
            dotnet run --project src/App/SoloDevBoard.App --no-launch-profile --no-build \
            >>"$APP_LOG" 2>&1 &
          APP_PID=$!

          ATTEMPTS=0
          until curl -sf http://localhost:5080/health > /dev/null; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "$ATTEMPTS" -ge 60 ]; then
              echo "::error::SoloDevBoard did not become healthy within 120 seconds."
              echo "Application log:"
              cat "$APP_LOG"
              kill "$APP_PID" || true
              exit 1
            fi
            sleep 2
          done

          echo "Application is healthy. Running Playwright E2E suite (PAT mode)..."
          cd tests/E2E
          PLAYWRIGHT_HTML_OPEN=never npm test
          TEST_EXIT=$?

          kill "$APP_PID" || true

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "::error::Playwright E2E suite failed with exit code $TEST_EXIT."
            echo "Application log:"
            cat "$APP_LOG"
            exit "$TEST_EXIT"
          fi

          echo "Playwright E2E suite passed (PAT mode)."

  e2e-hosted:
    name: End-to-End (Playwright, Hosted mode)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/E2E/package-lock.json

      - name: Restore and build solution
        run: |
          dotnet restore SoloDevBoard.slnx
          dotnet build src/App/SoloDevBoard.App/SoloDevBoard.App.csproj --no-restore

      - name: Install Playwright dependencies
        working-directory: tests/E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (Hosted mode)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5080
          E2E_AUTH_MODE: hosted
        run: |
          APP_LOG="$(mktemp)"
          echo "Application logs are captured in: $APP_LOG"

          ASPNETCORE_URLS=http://localhost:5080 \
            ASPNETCORE_ENVIRONMENT=Development \
            GitHubAuth__PersonalAccessToken=- \
            GitHubAuth__HostedSignInEnabled=true \
            GitHubAuth__HostedGitHubAppClientId=ci-e2e-hosted-client-id \
            GitHubAuth__HostedGitHubAppClientSecret=ci-e2e-hosted-client-secret \
            HostedAdmissionControl__Enabled=true \
            HostedAdmissionControl__AllowedUserLogins=ci-test-user \
            HostedAdmissionControl__AllowedOrganisationLogins=- \
            dotnet run --project src/App/SoloDevBoard.App --no-launch-profile --no-build \
            >>"$APP_LOG" 2>&1 &
          APP_PID=$!

          ATTEMPTS=0
          until curl -sf http://localhost:5080/health > /dev/null; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "$ATTEMPTS" -ge 60 ]; then
              echo "::error::SoloDevBoard did not become healthy within 120 seconds."
              echo "Application log:"
              cat "$APP_LOG"
              kill "$APP_PID" || true
              exit 1
            fi
            sleep 2
          done

          echo "Application is healthy. Running Playwright hosted login-gate suite..."
          cd tests/E2E
          PLAYWRIGHT_HTML_OPEN=never npx playwright test auth-entry-hosted.spec.ts
          TEST_EXIT=$?

          kill "$APP_PID" || true

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "::error::Playwright hosted E2E suite failed with exit code $TEST_EXIT."
            echo "Application log:"
            cat "$APP_LOG"
            exit "$TEST_EXIT"
          fi

          echo "Playwright hosted E2E suite passed."
