name: CD - Deploy to Azure

# Three-tier CD pipeline (DEC-021):
#   developer  — workflow_dispatch only; PAT mode; restricted GitHub Environment
#   staging    — push to main; GitHub App hosted sign-in
#   production — push v* tag; GitHub App; required reviewers on GitHub Environment
#
# Before the first deploy, follow docs/deployment.md to configure Azure OIDC,
# GitHub Environments (developer, staging, production), and environment secrets.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate before deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SoloDevBoard.slnx

      - name: Build solution
        run: dotnet build SoloDevBoard.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test SoloDevBoard.slnx --no-build --verbosity normal

  developer:
    name: Deploy to developer
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/aspire-deploy.yml
    with:
      aspire_environment: Development
      github_environment: developer
    secrets: inherit

  staging:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    uses: ./.github/workflows/aspire-deploy.yml
    with:
      aspire_environment: Staging
      github_environment: staging
    secrets: inherit

  production:
    name: Deploy to production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    uses: ./.github/workflows/aspire-deploy.yml
    with:
      aspire_environment: Production
      github_environment: production
    secrets: inherit
