version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    groups:
      test-packages:
        patterns:
          - bunit
          - coverlet.*
          - Microsoft.NET.Test.Sdk
          - Moq
          - NSubstitute
          - xunit.*
        update-types:
          - minor
          - patch
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
        update-types:
          - minor
          - patch
      azure:
        patterns:
          - Azure.*
        update-types:
          - minor
          - patch
      opentelemetry:
        patterns:
          - OpenTelemetry.*
        update-types:
          - minor
          - patch
      analyzers:
        patterns:
          - "*[Aa]nalyzers*"
          - Microsoft.CodeAnalysis.*
        update-types:
          - minor
          - patch
      other:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon

  - package-ecosystem: devcontainers
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    groups:
      devcontainers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tests/E2E
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
