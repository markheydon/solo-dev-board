version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    assignees:
      - "markheydon"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
        update-types:
          - "minor"
          - "patch"
      azure:
        patterns:
          - "Azure.*"
        update-types:
          - "minor"
          - "patch"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
        update-types:
          - "minor"
          - "patch"
      test-packages:
        patterns:
          - "bunit"
          - "coverlet.collector"
          - "Microsoft.NET.Test.Sdk"
          - "Moq"
          - "xunit"
          - "xunit.*"
        update-types:
          - "minor"
          - "patch"
      analyzers:
        patterns:
          - ".*analyzers.*"
          - "Microsoft.CodeAnalysis.*"
        update-types:
          - "minor"
          - "patch"
      other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    assignees:
      - "markheydon"
